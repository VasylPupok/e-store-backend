version: '3.8'

services:
  ## Infrastructure Services
  postgres:
    image: postgres:14
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 3

  ## E-Commerce Microservices
  eureka-server:
    image: eclipse-temurin:17-jre
    container_name: eureka-server
    ports:
      - "8761:8761"
    volumes:
      - ./eureka-server/target/eureka-server-1.0.0.jar:/app/app.jar
    working_dir: /app
    command: java -jar app.jar
    environment:
      - SERVER_PORT=8761
      - EUREKA_CLIENT_REGISTER-WITH-EUREKA=false
      - EUREKA_CLIENT_FETCH-REGISTRY=false
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://localhost:8761/eureka/
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    image: eclipse-temurin:17-jre
    container_name: api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./api-gateway/target/api-gateway-1.0.0.jar:/app/app.jar
    working_dir: /app
    command: java -jar app.jar
    environment:
      - SERVER_PORT=8080
      - SPRING_REDIS_HOST=redis
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER-IP-ADDRESS=true
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    image: eclipse-temurin:17-jre
    container_name: user-service
    ports:
      - "8085:8085"
    volumes:
      - ./user-service/target/user-service-1.0.0.jar:/app/app.jar
    working_dir: /app
    command: java -jar app.jar
    environment:
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/user_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER-IP-ADDRESS=true
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  product-service:
    image: eclipse-temurin:17-jre
    container_name: product-service
    ports:
      - "8081:8081"
    volumes:
      - ./product-service/target/product-service-1.0.0.jar:/app/app.jar
    working_dir: /app
    command: java -jar app.jar
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/product_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER-IP-ADDRESS=true
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reservation-service:
    image: eclipse-temurin:17-jre
    container_name: reservation-service
    ports:
      - "8084:8084"
    volumes:
      - ./reservation-service/target/reservation-service-1.0.0.jar:/app/app.jar
    working_dir: /app
    command: java -jar app.jar
    environment:
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/reservation_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER-IP-ADDRESS=true
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  queue-service:
    image: eclipse-temurin:17-jre
    container_name: queue-service
    ports:
      - "8083:8083"
    volumes:
      - ./queue-service/target/queue-service-1.0.0.jar:/app/app.jar
    working_dir: /app
    command: java -jar app.jar
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/queue_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER-IP-ADDRESS=true
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cart-service:
    image: eclipse-temurin:17-jre
    container_name: cart-service
    ports:
      - "8082:8082"
    volumes:
      - ./cart-service/target/cart-service-1.0.0.jar:/app/app.jar
    working_dir: /app
    command: java -jar app.jar
    environment:
      - SERVER_PORT=8082
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/cart_db
      - SPRING_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER-IP-ADDRESS=true
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  rabbitmq-data: